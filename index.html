<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5ebdc">
  <meta name="description" content="贪吃小猪：滑动控制方向，随机吃美食得分，每局三次复活。打开就能玩的手机小游戏。">
  <title>贪吃小猪</title>
  <link rel="icon" href="./assets/face.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs?v=cartoon-dress-1"></script>
</head>
<body>
  <main class="game">
    <header>
      <span class="flower" aria-hidden="true">✿</span>
      <h1>贪吃小猪</h1>
      <button id="pause" class="icon-button" aria-label="暂停游戏" disabled>Ⅱ</button>
    </header>
    <section class="stats" aria-label="游戏成绩">
      <div><span>本局得分</span><strong id="score">0</strong></div>
      <div><span>本机最高</span><strong id="best">0</strong></div>
      <div class="revives"><span>剩余复活</span><strong id="lives" aria-label="剩余3次复活">3 <small>次</small></strong></div>
    </section>
    <div class="board-frame">
      <div class="board">
        <canvas id="canvas" aria-label="贪吃小猪游戏棋盘，滑动或用下方方向按钮控制"></canvas>
        <div id="chatter" class="speech" aria-live="polite" hidden>小猪开饭啦～</div>
        <div id="overlay" class="overlay">
          <div class="message">
            <img src="./assets/face.png" width="84" height="84" alt="小猪头像" class="portrait">
            <h2 id="message-title">开吃啦！</h2>
            <p id="message-text">吃到美食加 10 分<br>每局有 3 次复活机会</p>
            <button id="primary" class="primary">开始游戏</button>
          </div>
        </div>
      </div>
    </div>
    <p class="hint" id="hint" aria-live="polite">滑动棋盘，或点按方向键</p>
    <div class="controls" aria-label="方向控制">
      <button class="direction up" data-direction="up" aria-label="向上">↑</button>
      <button class="direction left" data-direction="left" aria-label="向左">←</button>
      <span class="control-flower" aria-hidden="true">✿</span>
      <button class="direction right" data-direction="right" aria-label="向右">→</button>
      <button class="direction down" data-direction="down" aria-label="向下">↓</button>
    </div>
    <footer>
      <button id="restart" class="text-button">重新开始</button>
      <span aria-hidden="true">·</span>
      <button id="share" class="text-button">分享游戏</button>
      <span aria-hidden="true">·</span>
      <a href="./download.html" class="text-button">安装下载</a>
    </footer>
    <p id="toast" class="toast" role="status" hidden></p>
    <dialog id="share-dialog">
      <h2>把链接发给朋友</h2>
      <input id="share-url" aria-label="游戏链接" readonly>
      <button id="close-share" class="primary">知道了</button>
    </dialog>
    <noscript>请启用浏览器的 JavaScript 来玩游戏。</noscript>
  </main>
</body>
</html>
